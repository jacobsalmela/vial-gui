name: Test

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0 libudev1 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Setup venv
      run: |
        python3 -m venv venv
        . venv/bin/activate
        pip install -r test-requirements.txt

    - name: Run tests
      run: |
        source venv/bin/activate
        pytest -v src/main/python/test
